[build-system]
requires = ["setuptools>=61.0", "pybind11>=2.10.0"]
build-backend = "setuptools.build_meta"

[project]
name = "garuda-stream-hub"
version = "1.0.0"
description = "One-Tap Ultra-Low Latency Android Streaming Utility for Garuda Linux"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyQt6>=6.4.0",
    "pybind11>=2.10.0",
    "zeroconf>=0.39.0",
]

[project.scripts]
garuda-stream-hub = "src.main:main"
